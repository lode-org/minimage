[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "minimage"
dynamic = ["version"]
description = "Minimum-image convention for periodic parallelepiped cells"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Rohit Goswami", email = "rgoswami@ieee.org" }]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0", "numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/lode-org/minimage"
Repository = "https://github.com/lode-org/minimage"
Documentation = "https://docs.rs/minimage"

[tool.maturin]
manifest-path = "python/Cargo.toml"
module-name = "minimage._lib"
python-source = "."
# The stable ABI: one wheel per platform for CPython 3.10 and newer, and
# an sdist that also builds on interpreters newer than PyO3 0.23 knows.
features = ["pyo3/extension-module", "pyo3/abi3-py310"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
