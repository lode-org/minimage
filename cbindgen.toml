# cbindgen config for include/minimage.h.
# Source of truth is src/capi.rs; this file only styles the generated header.
# Meson and CMake install the shipped include/minimage.h and must not run
# cbindgen. Regenerate with: scripts/regen-capi-headers.sh
#
# Do not add [parse.expand] crates: that runs cargo expand (a compile).
# cbindgen parses src/ without building.
# Do not export mi_cell_ortho from Rust; it is a header-only inline in trailer.

language = "C"

############## Options for Wrapping the Contents of the Header #################

header = """
/* Generated by cbindgen from src/capi.rs. Do not edit. */

/*
 * minimage C API.
 *
 * Conventions and units
 *   - All coordinates, lattice vectors, origins, and displacements share
 *     one caller-chosen Cartesian length unit; squared distances and
 *     cutoffs use that unit squared. minimage_cell_from_con_box takes
 *     angles in degrees.
 *   - Displacement is the wrapped vector from p to q: wrap(q - p).
 *
 * Memory ownership
 *   - Constructor calls write one mi_cell or mi_pbc_cell into a
 *     caller-owned out.
 *   - Distance, displacement, wrap, fixed-point, filter, centroid, and
 *     pair-reduction calls write into caller-owned buffers.
 *   - minimage_last_error returns a thread-local pointer. Do not free.
 *     The pointer is invalid after the next minimage_* call on the same
 *     thread. minimage_version does not read or write the slot.
 *   - minimage_version returns a process-static pointer. Do not free.
 *
 * Errors and thread safety
 *   - Every int-returning function returns 0 on success and 1 on failure.
 *   - Distinct cells and distance calls may run concurrently.
 *   - minimage_last_error is a thread-local slot, cleared on the next
 *     successful call on that thread. Read it on the same thread that
 *     received a nonzero return.
 */
"""
include_guard = "MINIMAGE_H"
include_version = true
pragma_once = true
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"
no_includes = false
cpp_compat = true
trailer = """
#ifndef MINIMAGE_MI_CELL_ORTHO_H
#define MINIMAGE_MI_CELL_ORTHO_H

#ifdef __cplusplus
extern "C" {
#endif

/**
 * Orthorhombic cell with origin at zero.
 */
static inline mi_cell mi_cell_ortho(double lx, double ly, double lz) {
    mi_cell c;
    c.ax = lx;
    c.ay = 0.0;
    c.az = 0.0;
    c.bx = 0.0;
    c.by = ly;
    c.bz = 0.0;
    c.cx = 0.0;
    c.cy = 0.0;
    c.cz = lz;
    c.ox = 0.0;
    c.oy = 0.0;
    c.oz = 0.0;
    return c;
}

#ifdef __cplusplus
}  /* extern "C" */
#endif

#endif  /* MINIMAGE_MI_CELL_ORTHO_H */
"""

############################ Code Style Options ################################

line_length = 80
tab_width = 4
braces = "SameLine"
documentation = true
documentation_style = "Doxy"
documentation_length = "full"
line_endings = "LF"

############################# Codegen Options ##################################

style = "both"
sort_by = "Name"
usize_is_size_t = true

[export]
include = [
    "mi_cell",
    "mi_image_pair",
    "mi_pbc_cell",
    "minimage_cell_from_ase",
    "minimage_cell_from_con",
    "minimage_cell_from_con_box",
    "minimage_cell_from_lammps",
    "minimage_cell_from_lammps_bounds",
    "minimage_cell_from_vectors",
    "minimage_cell_from_vesin",
    "minimage_displacement",
    "minimage_displacement_euclidean",
    "minimage_displacement_euclidean_pbc",
    "minimage_dist2",
    "minimage_dist2_euclidean_many",
    "minimage_dist2_euclidean_pairs",
    "minimage_dist2_euclidean_pairs_warm",
    "minimage_dist2_euclidean_pbc",
    "minimage_dist2_fixed",
    "minimage_dist2_fixed32",
    "minimage_dist2_many",
    "minimage_dist2_many_fixed",
    "minimage_dist2_many_fixed32",
    "minimage_dist2_ortho_diffs",
    "minimage_dist2_pairs",
    "minimage_dist2_pairs_fixed",
    "minimage_dist2_pairs_fixed32",
    "minimage_dist2_shifted_many",
    "minimage_face_spacing",
    "minimage_filter_shifted",
    "minimage_fixed32_many",
    "minimage_fixed_many",
    "minimage_last_error",
    "minimage_cutoff_exceeds_half_width",
    "minimage_pairs_within_images",
    "minimage_pbc_cell_from_ase",
    "minimage_reduce_pairs",
    "minimage_ring_centroid",
    "minimage_version",
    "minimage_wrap_many",
]
exclude = ["mi_cell_ortho", "Cell", "Error"]
item_types = ["enums", "structs", "unions", "typedefs", "opaque", "functions", "constants"]

[export.rename]

[fn]
rename_args = "None"
args = "auto"
sort_by = "Name"

[struct]
rename_fields = "None"
derive_constructor = false
derive_eq = false
derive_neq = false
derive_lt = false
derive_lte = false
derive_gt = false
derive_gte = false

[enum]
rename_variants = "None"
add_sentinel = false
prefix_with_name = false
derive_helper_methods = false
derive_const_casts = false
derive_mut_casts = false
derive_tagged_enum_destructor = false
derive_tagged_enum_copy_constructor = false

[const]
allow_static_const = true
allow_constexpr = false
sort_by = "Name"

[macro_expansion]
bitflags = false

[parse]
parse_deps = false
exclude = []
clean = false
extra_bindings = []
