name: ci

on:
  push:
    branches:
      - main
      - 'perf/**'
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  header-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cbindgen --version 0.29.4
      - run: scripts/regen-capi-headers.sh --check

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-py-${{ hashFiles('Cargo.lock', 'python/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-py-
      - name: Install Python test deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install maturin pytest numpy
      - name: maturin develop
        run: |
          . .venv/bin/activate
          maturin develop
      - name: pytest
        run: |
          . .venv/bin/activate
          pytest tests/python -q

  cargo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        crate:
          - name: default
            flags: ""
          - name: serial
            flags: --no-default-features --features capi
    name: cargo (${{ matrix.os }}, ${{ matrix.crate.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: CPU flags
        run: |
          echo "runner=${{ matrix.os }}"
          if [ -r /proc/cpuinfo ]; then
            grep -m1 'model name' /proc/cpuinfo || true
            grep -m1 flags /proc/cpuinfo || true
          fi
          if command -v sysctl >/dev/null 2>&1; then
            sysctl -n machdep.cpu.brand_string 2>/dev/null || true
            sysctl machdep.cpu.features 2>/dev/null || true
            sysctl hw.optional.neon 2>/dev/null || true
          fi
          command -v lscpu >/dev/null && lscpu || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo test --locked --workspace --exclude minimage-python ${{ matrix.crate.flags }}
      - name: NEON bench
        if: matrix.os == 'ubuntu-24.04-arm' && matrix.crate.name == 'default'
        run: cargo test --release --locked --lib bench_dispatch -- --ignored --nocapture
      - run: cargo clippy --locked --workspace --exclude minimage-python --all-targets ${{ matrix.crate.flags }} -- -D warnings

  # Linux and macOS must keep CARGO_TARGET_<TRIPLE>_LINKER pointed at
  # the C driver. Windows MSVC must leave it unset: cl cannot link
  # rustc build scripts. Examples stay off on MSVC because link.exe
  # needs an import library the cargo custom target does not stage;
  # the library build itself is the MSVC proof.
  meson:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            require_syntax: gcc
            pkgconfig: true
          - os: macos-latest
            require_syntax: gcc
            pkgconfig: false
          - os: windows-latest
            require_syntax: msvc
            pkgconfig: false
    name: meson (${{ matrix.os }}, ${{ matrix.require_syntax }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install meson ninja
      - name: Configure
        run: |
          set -euo pipefail
          if [ "${{ matrix.require_syntax }}" = "msvc" ]; then
            # Point Meson at setup-python, not the WindowsApps python3 stub.
            pyexe="$(python -c 'import sys; print(sys.executable.replace("\\", "/"))')"
            native="${RUNNER_TEMP:-/tmp}/minimage-python.ini"
            printf "[binaries]\npython = '%s'\npython3 = '%s'\n" "$pyexe" "$pyexe" > "$native"
            meson setup build --vsenv --native-file "$native" -Dwith_examples=false
          else
            meson setup build
          fi
      - name: Cargo linker matches the C toolchain
        run: |
          set -euo pipefail
          python scripts/check-cargo-linker.py build --require-syntax "${{ matrix.require_syntax }}"
      - name: Compile and test
        run: |
          set -euo pipefail
          meson compile -C build
          if [ "${{ matrix.require_syntax }}" = "msvc" ]; then
            meson test -C build --print-errorlogs --timeout-multiplier 2
          else
            meson test -C build --print-errorlogs
          fi
      - name: Install
        if: matrix.pkgconfig
        run: meson install -C build --destdir "$PWD/destdir"
      - name: pkg-config after meson install
        if: matrix.pkgconfig
        run: |
          prefix="$PWD/destdir/usr/local"
          export PKG_CONFIG_PATH="$prefix/lib/x86_64-linux-gnu/pkgconfig:$prefix/lib/pkgconfig"
          pkg-config --exists --print-errors minimage
          pkg-config --modversion minimage
          pkg-config --cflags --libs minimage
          test -f "$prefix/include/minimage.h"
          test -f "$prefix/include/minimage.hpp"
          test -f "$prefix/lib/x86_64-linux-gnu/libminimage.a" \
            -o -f "$prefix/lib/libminimage.a"
          test -f "$prefix/lib/x86_64-linux-gnu/libminimage.so" \
            -o -f "$prefix/lib/libminimage.so" \
            -o -f "$prefix/lib/libminimage.dylib"

  cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: cmake --install build
      - name: find_package and pkg-config after cmake install
        run: |
          test -f prefix/include/minimage.h
          test -f prefix/lib/libminimage.a
          test -f prefix/lib/libminimage.so -o -f prefix/lib/libminimage.dylib
          test -f prefix/lib/pkgconfig/minimage.pc
          test -f prefix/lib/cmake/minimage/minimageConfig.cmake
          export PKG_CONFIG_PATH="$PWD/prefix/lib/pkgconfig"
          pkg-config --exists --print-errors minimage
          pkg-config --modversion minimage
          cmake -S tests/cmake-consumer -B find-build \
            -DCMAKE_PREFIX_PATH="$PWD/prefix" \
            -DMINIMAGE_EXAMPLE="$PWD/examples/wrap_pair.cpp"
          cmake --build find-build
          export LD_LIBRARY_PATH="$PWD/prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export DYLD_LIBRARY_PATH="$PWD/prefix/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          ./find-build/find_mi

  # TODO: I0 has not landed. Enable this job when OmniPotentRPC/rgpot
  # branch ci/isa-audit publishes .github/workflows/isa-audit.yml.
  # isa-audit:
  #   uses: OmniPotentRPC/rgpot/.github/workflows/isa-audit.yml@ci/isa-audit
