name: ci

on:
  push:
    branches:
      - main
      - 'perf/**'
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  header-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo install cbindgen --version 0.29.4
      - run: scripts/regen-capi-headers.sh --check

  capi-symbols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Reject unprefixed C ABI symbols
        run: bash scripts/check-capi-symbols.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Check rustdoc warnings and missing docs
        env:
          RUSTDOCFLAGS: "-D warnings -D missing_docs"
        run: cargo doc --no-deps --locked
      - name: Run doctests
        run: cargo test --doc --locked
      - name: Check C header Doxygen comments
        run: clang -fsyntax-only -Wall -Wextra -Wdocumentation -Werror -Iinclude examples/wrap_pair.c
      - name: Install Emacs for org-mode export check
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox
      - name: Check docs links and HTML export
        run: python3 scripts/check-docs.py --require-emacs

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install cogapp==3.6.0 meson==1.12.1
      - name: Every version copy matches Cargo.toml
        run: python scripts/check_version_lockstep.py
      - name: A release tag names the version and the wrap tag
        if: github.ref_type == 'tag'
        run: python scripts/check_version_lockstep.py --tag "$GITHUB_REF_NAME"
      - name: Drift the sync misses still fails the check
        run: python scripts/test_check_version_lockstep.py
      - name: The sync leaves the tree unchanged
        run: |
          python scripts/sync-version.py
          git diff --exit-code

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-py-${{ hashFiles('Cargo.lock', 'python/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-py-
      - name: Install Python test deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install maturin pytest numpy
      - name: maturin develop
        run: |
          . .venv/bin/activate
          maturin develop
      - name: pytest
        run: |
          . .venv/bin/activate
          pytest tests/python -q

  cargo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        crate:
          - name: default
            flags: ""
          - name: serial
            flags: --no-default-features --features capi
    name: cargo (${{ matrix.os }}, ${{ matrix.crate.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CPU flags
        run: |
          echo "runner=${{ matrix.os }}"
          if [ -r /proc/cpuinfo ]; then
            grep -m1 'model name' /proc/cpuinfo || true
            grep -m1 flags /proc/cpuinfo || true
          fi
          if command -v sysctl >/dev/null 2>&1; then
            sysctl -n machdep.cpu.brand_string 2>/dev/null || true
            sysctl machdep.cpu.features 2>/dev/null || true
            sysctl hw.optional.neon 2>/dev/null || true
          fi
          command -v lscpu >/dev/null && lscpu || true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo test --locked --workspace --exclude minimage-python ${{ matrix.crate.flags }}
      - name: Legacy C ABI alias tests
        if: matrix.crate.name == 'default'
        run: cargo test --locked --test abi --features capi-compat-names
      - name: NEON bench
        if: matrix.os == 'ubuntu-24.04-arm' && matrix.crate.name == 'default'
        run: cargo test --release --locked --lib bench_dispatch -- --ignored --nocapture
      - run: cargo clippy --locked --workspace --exclude minimage-python --all-targets ${{ matrix.crate.flags }} -- -D warnings

  meson:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install meson ninja
      - run: meson setup build
      - run: meson compile -C build
      - run: meson test -C build --print-errorlogs
      - run: meson install -C build --destdir "$PWD/destdir"
      - name: pkg-config after meson install
        run: |
          prefix="$PWD/destdir/usr/local"
          export PKG_CONFIG_PATH="$prefix/lib/x86_64-linux-gnu/pkgconfig:$prefix/lib/pkgconfig"
          pkg-config --exists --print-errors minimage
          pkg-config --modversion minimage
          pkg-config --cflags --libs minimage
          test -f "$prefix/include/minimage.h"
          test -f "$prefix/include/minimage.hpp"
          test -f "$prefix/lib/x86_64-linux-gnu/libminimage.a" \
            -o -f "$prefix/lib/libminimage.a"
          test -f "$prefix/lib/x86_64-linux-gnu/libminimage.so" \
            -o -f "$prefix/lib/libminimage.so" \
            -o -f "$prefix/lib/libminimage.dylib"

  cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: cmake --install build
      - name: find_package and pkg-config after cmake install
        run: |
          test -f prefix/include/minimage.h
          test -f prefix/lib/libminimage.a
          test -f prefix/lib/libminimage.so -o -f prefix/lib/libminimage.dylib
          test -f prefix/lib/pkgconfig/minimage.pc
          test -f prefix/lib/cmake/minimage/minimageConfig.cmake
          export PKG_CONFIG_PATH="$PWD/prefix/lib/pkgconfig"
          pkg-config --exists --print-errors minimage
          pkg-config --modversion minimage
          cmake -S tests/cmake-consumer -B find-build \
            -DCMAKE_PREFIX_PATH="$PWD/prefix" \
            -DMINIMAGE_EXAMPLE="$PWD/examples/wrap_pair.cpp"
          cmake --build find-build
          export LD_LIBRARY_PATH="$PWD/prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export DYLD_LIBRARY_PATH="$PWD/prefix/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          ./find-build/find_mi

  isa-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Unstripped library
        run: |
          cargo build --release --lib --locked
          mkdir -p isa-audit-input
          cp -a target/release/libminimage.so isa-audit-input/libminimage-x86_64.so
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unstripped-libs
          path: isa-audit-input

  isa-audit:
    needs: isa-build
    permissions:
      contents: read
    uses: OmniPotentRPC/rgpot/.github/workflows/isa-audit.yml@000887fc75392c024eee070f23655f74a0865a15
    with:
      artifact-name: unstripped-libs
      allow-file: isa-allow.toml
      baseline: x86-64
