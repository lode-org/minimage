[package]
name = "minimage"
version.workspace = true
edition = "2021"
rust-version = "1.70"
description = "Minimum-image convention for periodic parallelepiped cells"
license = "MIT"
repository = "https://github.com/lode-org/minimage"
homepage = "https://lode-org.github.io/minimage/"
documentation = "https://lode-org.github.io/minimage/"
keywords = ["molecular-dynamics", "periodic", "minimum-image", "pbc"]
categories = ["science", "algorithms"]
readme = "README.md"

[workspace]
members = ["python"]
exclude = ["burn"]
resolver = "2"

[workspace.package]
version = "0.2.0"

# The newest pushed release tag, which the Meson wrap snippets name. The
# release commit sets it with `scripts/sync-version.py --release`, and the tag
# goes on that commit.
[workspace.metadata.release]
tag = "v0.1.4"

[lib]
name = "minimage"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = ["capi"]
capi = []

[[test]]
name = "abi"
required-features = ["capi"]

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
sha2 = "0.10"
